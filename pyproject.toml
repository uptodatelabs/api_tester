[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-tester"
version = "1.0.0"
description = "API testing tool with a Textual TUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual",
    "httpx",
    "pytest",
]

[project.scripts]
api_tester = "api_tester.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
